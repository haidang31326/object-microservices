services:
  mysql:
    image: mysql:8.3.0
    container_name: eventtick-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ticketing
    ports:
      - "3103:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: eventtick-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 3000
    ports:
      - "2181:2181"

  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: eventtick-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx400M -Xms400M"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eventtick-kafka-ui
    depends_on:
      - kafka-broker
    ports:
      - "8084:8080"
    environment:
      KAFKA_CLUSTERS_NAME: local
      KAFKA_CLUSTERS_BOOTSTRAPSERVERS: kafka-broker:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  keycloak-db:
    image: mysql:8.3.0
    container_name: eventtick-keycloak-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
    volumes:
      - keycloak-db-data:/var/lib/mysql

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: eventtick-keycloak
    command: ["start-dev", "--import-realm"]
    depends_on:
      - keycloak-db
    ports:
      - "8091:8080"
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://keycloak-db:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak/realms:/opt/keycloak/data/import:ro

  inventory-service:
    build: .
    container_name: eventtick-inventory-service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: vps
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketing
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password

  booking-service:
    build: ../../bookingservice
    container_name: eventtick-booking-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka-broker:
        condition: service_started
      inventory-service:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: vps
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketing
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      INVENTORY_SERVICE_URL: http://inventory-service:8080/api/v1/inventory

  order-service:
    build: ../../orderservice
    container_name: eventtick-order-service
    depends_on:
      mysql:
        condition: service_healthy
      kafka-broker:
        condition: service_started
      inventory-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: vps
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketing
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
      INVENTORY_SERVICE_URL: http://inventory-service:8080/api/v1/inventory

  api-gateway:
    build: ../../apigateway
    container_name: eventtick-api-gateway
    depends_on:
      inventory-service:
        condition: service_started
      booking-service:
        condition: service_started
      order-service:
        condition: service_started
      keycloak:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: vps
      INVENTORY_SERVICE_URL: http://inventory-service:8080
      BOOKING_SERVICE_URL: http://booking-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/ticketing/protocol/openid-connect/certs
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ticketing

  frontend:
    build: ../../frontend
    container_name: eventtick-frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:80"

volumes:
  db-data:
  keycloak-db-data:
